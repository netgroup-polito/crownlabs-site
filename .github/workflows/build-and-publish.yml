name: Build and publish the CrownLabs website
on: [push]

jobs:
  build-and-publish:
    name: Build and publish the CrownLabs website
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: 'true'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push the CrownSite image
      uses: docker/build-push-action@v7
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: |
          crownlabs/website:latest
          crownlabs/website:${{ github.sha }}

    - name: Notify Event to OPS
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.CI_TOKEN }}
        repository: netgroup-polito/ArgoCD-CrownNG
        event-type: website-preprod-event
