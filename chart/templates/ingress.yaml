apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  rules:
  - host: {{ .Values.hostName }}
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: website
            port:
              name: http
  tls:
  - hosts:
    - {{ .Values.hostName }}
    secretName: website-cert
