{{- if .Values.routing.gwapiMode }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
spec:
  hostnames:
  - {{ .Values.hostName | quote }}
  parentRefs:
  - name: {{ required "gateway.name must be set when routing.gwapiMode=true" .Values.gateway.name | quote }}
    namespace: {{ .Values.gateway.namespace | default .Release.Namespace | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: website
      port: 80
{{- end }}
