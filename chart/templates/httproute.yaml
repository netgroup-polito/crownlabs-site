{{- if .Values.routing.gwapiMode }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") }}
{{- fail "routing.gwapiMode=true requires the Gateway API HTTPRoute CRD (gateway.networking.k8s.io/v1)" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
spec:
  hostnames:
  - {{ .Values.hostName | quote }}
  parentRefs:
  - name: {{ required "gateway.name must be set when routing.gwapiMode=true" .Values.gateway.name | quote }}
    {{- if .Values.gateway.namespace }}
    namespace: {{ .Values.gateway.namespace | quote }}
    {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: website
      port: 80
{{- end }}
