replicas: 2

# When true, deploy an HTTPRoute instead of an Ingress.
gatewayApiMode: true

hostName: crownlabs.polito.it

gateway:
  # Name of the referenced Gateway. Defaults to "crownlabs-main".
  name: "crownlabs-main"
  # Section name of the Gateway listener (defaults to "https" matching CrownLabs Envoy Gateway listener).
  sectionName: "https"
  # Namespace of the referenced Gateway (defaults to "crownlabs").
  # Note: if deploying in a different namespace (e.g. website-test), ensure that namespace is allowed by the Gateway's allowedRoutes
  # (e.g. labeled with crownlabs.polito.it/gw-access: crownlabs-main-production in CrownLabs).
  namespace: "crownlabs"

# Additional labels to attach to the HTTPRoute
labels: {}

image:
  repository: crownlabs/website
  tag: latest
