replicas: 2

# When true, deploy an HTTPRoute instead of an Ingress.
gatewayApiMode: false

hostName: crownlabs.polito.it

gateway:
  # Required when Gateway API is enabled.
  name: ""
  # Section name of the Gateway listener (defaults to "https" matching CrownLabs Envoy Gateway listener).
  sectionName: "https"
  # Optional namespace of the referenced Gateway; when empty, the route targets a Gateway in the same namespace.
  # Note: if deploying in a different namespace, ensure that namespace is allowed by the Gateway's allowedRoutes
  # (e.g. labeled with crownlabs.polito.it/gw-access: crownlabs-main-production in CrownLabs).
  namespace: ""

# Additional labels to attach to the HTTPRoute
labels: {}

image:
  repository: crownlabs/website
  tag: latest
